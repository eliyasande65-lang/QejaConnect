<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1a1535">
    <title>Activity Monitor | QejaConnect Admin</title>
    <script>
        // Runs before first paint so the lock screen doesn't flash when a secret is already saved
        try { if (localStorage.getItem("qc_admin_secret")) document.documentElement.classList.add("has-secret"); } catch (e) {}
    </script>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            margin: 0;
            background: #f4f4f4;
            color: #222;
            overflow-x: hidden;
        }

        header {
            background: #1a1535;
            color: white;
            padding: 14px 16px;
            padding-top: calc(14px + env(safe-area-inset-top, 0px));
            padding-left: calc(16px + env(safe-area-inset-left, 0px));
            padding-right: calc(16px + env(safe-area-inset-right, 0px));
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            margin: 0;
            font-size: 1.15rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #adminKeyBar {
            display: none;
            gap: 8px;
            align-items: center;
            flex-shrink: 0;
        }

        #adminKeyBar button {
            padding: 9px 14px;
            border: none;
            border-radius: 8px;
            color: white;
            background: #7a1f2b;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
            min-height: 38px;
        }

        main {
            max-width: 1200px;
            margin: 16px auto;
            padding: 0 12px;
            padding-left: calc(12px + env(safe-area-inset-left, 0px));
            padding-right: calc(12px + env(safe-area-inset-right, 0px));
            padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background: white;
            border-radius: 14px;
            box-shadow: 0 0 10px rgba(0,0,0,0.08);
            padding: 16px;
            min-width: 0;
        }

        .card h2 {
            margin: 0 0 14px;
            color: indigo;
            font-size: 1.05rem;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .pulse-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #22c55e;
            display: inline-block;
            animation: pulse 1.8s infinite;
        }

        @keyframes pulse {
            0%   { box-shadow: 0 0 0 0 rgba(34,197,94,0.5); }
            70%  { box-shadow: 0 0 0 8px rgba(34,197,94,0); }
            100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); }
        }

        /* ── Online users ── */
        .online-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 10px;
        }

        .online-user-chip {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 13px;
            min-width: 0;
        }

        .online-user-chip .name {
            font-weight: 700;
            color: #166534;
            word-break: break-word;
        }

        .online-user-chip .role-badge {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: #dcfce7;
            color: #166534;
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: 6px;
            white-space: nowrap;
        }

        .online-user-chip .meta {
            color: #666;
            margin-top: 4px;
            font-size: 11.5px;
            word-break: break-all;
        }

        .empty-note {
            color: #999;
            font-size: 13px;
            padding: 10px 0;
        }

        /* ── Filters ── */
        .filters {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
            margin-bottom: 14px;
        }

        .filters .full {
            grid-column: 1 / -1;
        }

        .filters input, .filters select {
            width: 100%;
            min-width: 0;
            padding: 10px 11px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px; /* 16px stops iOS from zooming on focus */
            background: white;
            color: #222;
            min-height: 42px;
        }

        .filters button {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            background: #1a1535;
            color: white;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            min-height: 42px;
        }

        .filters button.ghost {
            background: white;
            color: #1a1535;
            border: 1.5px solid #1a1535;
        }

        .date-field {
            display: flex;
            flex-direction: column;
            gap: 3px;
            min-width: 0;
        }

        .date-field span {
            font-size: 11px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        /* ── Table (desktop) ── */
        .table-wrap {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        table th, table td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
            vertical-align: top;
        }

        table th {
            color: #666;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .action-tag {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
        }

        .tag-login               { background: #e0e7ff; color: #4338ca; }
        .tag-messaged_landlord   { background: #dbeafe; color: #1d4ed8; }
        .tag-sent_message        { background: #e0f2fe; color: #0369a1; }
        .tag-booked_property     { background: #fef3c7; color: #92400e; }
        .tag-uploaded_property   { background: #dcfce7; color: #166534; }
        .tag-renewed_listing     { background: #ede9fe; color: #6d28d9; }
        .tag-paid_rent           { background: #d1fae5; color: #065f46; }
        .tag-requested_extension { background: #fce7f3; color: #9d174d; }
        .tag-default             { background: #f1f5f9; color: #475569; }

        .details-cell {
            color: #555;
            max-width: 280px;
            word-break: break-word;
            overflow-wrap: anywhere;
            font-family: ui-monospace, Consolas, monospace;
            font-size: 11.5px;
        }

        .role-pill {
            font-size: 10.5px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 2px 8px;
            border-radius: 10px;
            background: #f1f5f9;
            color: #475569;
        }

        .role-pill.tenant   { background: #e0f2fe; color: #075985; }
        .role-pill.landlord { background: #fef3c7; color: #92400e; }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-top: 16px;
            font-size: 13px;
        }

        .pagination button {
            padding: 10px 16px;
            border: 1px solid #ccc;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            min-height: 40px;
        }

        .pagination button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .loading-row td {
            text-align: center;
            color: #999;
            padding: 30px;
        }

        /* ── Lock screen ── */
        #lockScreen {
            position: fixed;
            inset: 0;
            background: #1a1535;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 5000;
        }

        html.has-secret #lockScreen {
            display: none;
        }

        #lockScreen .box {
            background: white;
            padding: 26px 22px;
            border-radius: 16px;
            width: 100%;
            max-width: 340px;
            text-align: center;
        }

        #lockScreen input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin: 14px 0;
            font-size: 16px;
        }

        #lockScreen button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #1a1535;
            color: white;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
        }

        #lockScreen button:disabled {
            opacity: 0.6;
        }

        #lockScreen .err {
            color: #b91c1c;
            font-size: 12.5px;
            margin-top: 8px;
            min-height: 16px;
        }

        /* ── Tablet / desktop tweaks ── */
        @media (min-width: 700px) {
            header { padding-top: 18px; padding-bottom: 18px; }
            header h1 { font-size: 1.4rem; }
            main { margin: 25px auto; padding-left: 20px; padding-right: 20px; gap: 25px; }
            .card { padding: 20px; }
            .filters { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
            .filters .full { grid-column: auto; }
            .filters input, .filters select { font-size: 13px; }
        }

        /* ── Phones: turn the table into stacked cards, no sideways scroll ── */
        @media (max-width: 699px) {
            .table-wrap { overflow: visible; }

            table, thead, tbody, tr, td { display: block; width: 100%; }

            thead { display: none; }

            tbody tr {
                border: 1px solid #eee;
                border-radius: 12px;
                padding: 10px 12px;
                margin-bottom: 10px;
                background: #fff;
            }

            table td {
                border: none;
                padding: 5px 0;
                display: flex;
                justify-content: space-between;
                align-items: flex-start;
                gap: 12px;
                text-align: right;
                min-width: 0;
            }

            table td::before {
                content: attr(data-label);
                flex: 0 0 auto;
                color: #888;
                font-size: 10.5px;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.4px;
                padding-top: 2px;
                text-align: left;
            }

            td.details-cell {
                max-width: none;
                min-width: 0;
            }

            td.details-cell > span, td > span.val {
                min-width: 0;
                overflow-wrap: anywhere;
            }

            .loading-row { border: none !important; padding: 0 !important; }
            .loading-row td { display: block; text-align: center; padding: 24px 0; }
            .loading-row td::before { content: none; }
        }
    </style>
</head>
<body>

    <!-- Admin secret gate -->
    <div id="lockScreen">
        <div class="box">
            <h2 style="margin-top:0;color:#1a1535;">🔒 Admin Access</h2>
            <p style="color:#666;font-size:13.5px;">Enter the admin secret to view activity data.</p>
            <input type="password" id="adminSecretInput" placeholder="Admin secret" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false">
            <button id="unlockBtn" type="button">Unlock</button>
            <div class="err" id="lockErr"></div>
        </div>
    </div>

    <header>
        <h1>📊 Activity Monitor</h1>
        <div id="adminKeyBar">
            <button type="button" id="lockBtn">🔒 Lock</button>
        </div>
    </header>

    <main>

        <!-- ── ONLINE NOW ── -->
        <div class="card">
            <h2><span class="pulse-dot"></span> Online Right Now <span id="onlineCount" style="color:#999;font-weight:400;font-size:0.85rem;"></span></h2>
            <div class="online-grid" id="onlineGrid">
                <div class="empty-note">Loading…</div>
            </div>
        </div>

        <!-- ── ACTIVITY LOG ── -->
        <div class="card">
            <h2>📜 Activity Log</h2>

            <div class="filters">
                <input type="text" id="searchInput" class="full" placeholder="Search by name..." enterkeyhint="search">
                <select id="roleFilter">
                    <option value="">All roles</option>
                    <option value="tenant">Tenant</option>
                    <option value="landlord">Landlord</option>
                </select>
                <select id="actionFilter">
                    <option value="">All actions</option>
                    <option value="login">Login</option>
                    <option value="messaged_landlord">Messaged landlord</option>
                    <option value="sent_message">Sent message</option>
                    <option value="booked_property">Booked property</option>
                    <option value="uploaded_property">Uploaded property</option>
                    <option value="renewed_listing">Renewed listing</option>
                    <option value="paid_rent">Paid rent</option>
                    <option value="requested_extension">Requested extension</option>
                </select>
                <label class="date-field"><span>From</span><input type="date" id="fromDate"></label>
                <label class="date-field"><span>To</span><input type="date" id="toDate"></label>
                <button type="button" id="applyBtn">Apply</button>
                <button type="button" class="ghost" id="resetBtn">Reset</button>
            </div>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>User</th>
                            <th>Role</th>
                            <th>Action</th>
                            <th>Details</th>
                            <th>IP</th>
                            <th>When</th>
                        </tr>
                    </thead>
                    <tbody id="logsBody">
                        <tr class="loading-row"><td colspan="6">Loading…</td></tr>
                    </tbody>
                </table>
            </div>

            <div class="pagination">
                <button type="button" id="prevBtn">← Prev</button>
                <span id="pageLabel">Page 1</span>
                <button type="button" id="nextBtn">Next →</button>
            </div>
        </div>

    </main>

    <script>
        const API = "https://qeja-backend-azkf.onrender.com";
        const STORAGE_KEY = "qc_admin_secret";
        const PAGE_SIZE = 25;

        let adminSecret = "";
        let currentPage = 1;
        let totalLogs = 0;
        let dashboardStarted = false;
        let onlineTimer = null;
        let logsRequestId = 0;

        const $ = id => document.getElementById(id);

        /* ── localStorage helpers (safe if storage is blocked, e.g. private mode) ── */
        function getStoredSecret() {
            try { return localStorage.getItem(STORAGE_KEY) || ""; } catch (e) { return ""; }
        }
        function saveSecret(v) {
            try { localStorage.setItem(STORAGE_KEY, v); } catch (e) {}
        }
        function clearSecret() {
            try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
        }

        /* ── Escape anything coming from the server before putting it in innerHTML ── */
        function esc(v) {
            return String(v == null ? "" : v)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        /* ── Lock / unlock ── */
        function showLockScreen(message) {
            document.documentElement.classList.remove("has-secret");
            $("lockScreen").style.display = "flex";
            $("adminKeyBar").style.display = "none";
            $("lockErr").textContent = message || "";
            $("unlockBtn").disabled = false;
            $("unlockBtn").textContent = "Unlock";
            stopDashboard();
        }

        function hideLockScreen() {
            document.documentElement.classList.add("has-secret");
            $("lockScreen").style.display = "none";
            $("adminKeyBar").style.display = "flex";
        }

        // Wrong/expired secret: forget it and ask again
        function rejectSecret(message) {
            clearSecret();
            adminSecret = "";
            $("adminSecretInput").value = "";
            showLockScreen(message || "Incorrect admin secret.");
        }

        function unlock() {
            const val = $("adminSecretInput").value.trim() || getStoredSecret();
            if (!val) return;
            adminSecret = val;
            $("unlockBtn").disabled = true;
            $("unlockBtn").textContent = "Checking…";
            verifyAndEnter();
        }

        async function verifyAndEnter() {
            try {
                const res = await fetch(`${API}/admin/online-users`, {
                    headers: { "x-admin-secret": adminSecret }
                });
                if (res.status === 403 || res.status === 401) {
                    rejectSecret("Incorrect admin secret.");
                    return;
                }
                saveSecret(adminSecret);       // remembered for next visit
                hideLockScreen();
                initDashboard();
            } catch (err) {
                // Server unreachable: keep any saved secret, just let the user retry
                showLockScreen("Could not reach server. Try again.");
                if (getStoredSecret()) {
                    $("unlockBtn").textContent = "Retry";
                    $("adminSecretInput").placeholder = "Saved secret will be used";
                }
            }
        }

        function lockAgain() {
            clearSecret();
            location.reload();
        }

        /* ── Dashboard ── */
        function initDashboard() {
            if (dashboardStarted) return;
            dashboardStarted = true;
            loadOnlineUsers();
            loadLogs();
            startOnlinePolling();
        }

        function startOnlinePolling() {
            stopOnlinePolling();
            onlineTimer = setInterval(loadOnlineUsers, 15000);
        }
        function stopOnlinePolling() {
            if (onlineTimer) { clearInterval(onlineTimer); onlineTimer = null; }
        }
        function stopDashboard() {
            stopOnlinePolling();
            dashboardStarted = false;
        }

        // Save battery/data: pause polling while the tab is in the background
        document.addEventListener("visibilitychange", () => {
            if (!dashboardStarted) return;
            if (document.hidden) {
                stopOnlinePolling();
            } else {
                loadOnlineUsers();
                startOnlinePolling();
            }
        });

        function timeAgo(dateStr) {
            const diffMs = Date.now() - new Date(dateStr).getTime();
            const mins = Math.floor(diffMs / 60000);
            if (mins < 1) return "just now";
            if (mins < 60) return `${mins}m ago`;
            const hrs = Math.floor(mins / 60);
            if (hrs < 24) return `${hrs}h ago`;
            return new Date(dateStr).toLocaleDateString("en-KE", { day: "numeric", month: "short" });
        }

        async function loadOnlineUsers() {
            const grid = $("onlineGrid");
            const count = $("onlineCount");
            try {
                const res = await fetch(`${API}/admin/online-users`, {
                    headers: { "x-admin-secret": adminSecret }
                });
                if (res.status === 403 || res.status === 401) {
                    rejectSecret("Session expired. Enter the admin secret again.");
                    return;
                }
                const data = await res.json();

                if (!data.success) { grid.innerHTML = `<div class="empty-note">Failed to load.</div>`; return; }

                count.textContent = `(${data.online.length})`;

                if (!data.online.length) {
                    grid.innerHTML = `<div class="empty-note">No one is online right now.</div>`;
                    return;
                }

                grid.innerHTML = data.online.map(u => `
                    <div class="online-user-chip">
                        <span class="name">${esc(u.fullname || "Unknown")}</span>
                        <span class="role-badge">${esc(u.role)}</span>
                        <div class="meta">Seen ${esc(timeAgo(u.last_seen_at))} · ${esc(u.email || "—")}</div>
                    </div>
                `).join("");

            } catch (err) {
                grid.innerHTML = `<div class="empty-note">Network error.</div>`;
            }
        }

        function buildQuery() {
            const params = new URLSearchParams();
            params.set("page", currentPage);
            params.set("limit", PAGE_SIZE);

            const role = $("roleFilter").value;
            const action = $("actionFilter").value;
            const search = $("searchInput").value.trim();
            const from = $("fromDate").value;
            const to = $("toDate").value;

            if (role) params.set("role", role);
            if (action) params.set("action", action);
            if (search) params.set("search", search);
            if (from) params.set("from", from + " 00:00:00");
            if (to) params.set("to", to + " 23:59:59");

            return params.toString();
        }

        function applyFilters() {
            currentPage = 1;
            loadLogs();
        }

        function resetFilters() {
            $("roleFilter").value = "";
            $("actionFilter").value = "";
            $("searchInput").value = "";
            $("fromDate").value = "";
            $("toDate").value = "";
            currentPage = 1;
            loadLogs();
        }

        function formatDetails(raw) {
            if (!raw) return "—";
            try {
                const parsed = typeof raw === "string" ? JSON.parse(raw) : raw;
                if (parsed && typeof parsed === "object") {
                    const parts = Object.entries(parsed).map(([k, v]) =>
                        `${k}: ${v !== null && typeof v === "object" ? JSON.stringify(v) : v}`);
                    return parts.length ? parts.join(", ") : "—";
                }
                return String(parsed);
            } catch (e) {
                return String(raw);
            }
        }

        async function loadLogs() {
            const body = $("logsBody");
            const myRequest = ++logsRequestId;   // ignore stale responses if filters change quickly
            body.innerHTML = `<tr class="loading-row"><td colspan="6">Loading…</td></tr>`;

            try {
                const res = await fetch(`${API}/admin/activity-logs?${buildQuery()}`, {
                    headers: { "x-admin-secret": adminSecret }
                });
                if (myRequest !== logsRequestId) return;

                if (res.status === 403 || res.status === 401) {
                    rejectSecret("Session expired. Enter the admin secret again.");
                    return;
                }
                const data = await res.json();
                if (myRequest !== logsRequestId) return;

                if (!data.success || !data.logs.length) {
                    body.innerHTML = `<tr class="loading-row"><td colspan="6">No activity found for this filter.</td></tr>`;
                    totalLogs = 0;
                    updatePagination();
                    return;
                }

                totalLogs = data.total;

                body.innerHTML = data.logs.map(log => {
                    const action = String(log.action || "");
                    const tagClass = /^[a-z_]+$/.test(action) && action ? "tag-" + action : "tag-default";
                    const roleClass = /^[a-z_]+$/.test(String(log.role || "")) ? log.role : "";
                    const user = log.fullname || "Unknown (#" + log.user_id + ")";
                    return `
                        <tr>
                            <td data-label="User"><span class="val">${esc(user)}</span></td>
                            <td data-label="Role"><span class="role-pill ${roleClass}">${esc(log.role)}</span></td>
                            <td data-label="Action"><span class="action-tag ${tagClass}">${esc(action.replace(/_/g, " "))}</span></td>
                            <td data-label="Details" class="details-cell"><span>${esc(formatDetails(log.details))}</span></td>
                            <td data-label="IP"><span class="val">${esc(log.ip_address || "—")}</span></td>
                            <td data-label="When"><span class="val">${esc(new Date(log.created_at).toLocaleString("en-KE"))}</span></td>
                        </tr>`;
                }).join("");

                updatePagination();

            } catch (err) {
                if (myRequest !== logsRequestId) return;
                body.innerHTML = `<tr class="loading-row"><td colspan="6">Network error loading logs.</td></tr>`;
            }
        }

        function updatePagination() {
            const totalPages = Math.max(1, Math.ceil(totalLogs / PAGE_SIZE));
            $("pageLabel").textContent = `Page ${currentPage} of ${totalPages}`;
            $("prevBtn").disabled = currentPage <= 1;
            $("nextBtn").disabled = currentPage >= totalPages;
        }

        function changePage(delta) {
            const next = Math.max(1, currentPage + delta);
            if (next === currentPage) return;
            currentPage = next;
            loadLogs();
            window.scrollTo({ top: $("logsBody").closest(".card").offsetTop - 70, behavior: "smooth" });
        }

        /* ── Wire up events ── */
        $("unlockBtn").addEventListener("click", unlock);
        $("adminSecretInput").addEventListener("keydown", e => { if (e.key === "Enter") unlock(); });
        $("lockBtn").addEventListener("click", lockAgain);
        $("applyBtn").addEventListener("click", applyFilters);
        $("resetBtn").addEventListener("click", resetFilters);
        $("prevBtn").addEventListener("click", () => changePage(-1));
        $("nextBtn").addEventListener("click", () => changePage(1));
        $("searchInput").addEventListener("keydown", e => { if (e.key === "Enter") applyFilters(); });

        /* ── Auto-unlock: only ask for the secret if nothing is saved ── */
        adminSecret = getStoredSecret();
        if (adminSecret) {
            verifyAndEnter();
        } else {
            showLockScreen("");
        }
    </script>

</body>
</html>
