<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Send Email — QejaConnect</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial, sans-serif; background:#f4f6f8; padding:40px 16px; margin:0; }
    .card { background:#fff; max-width:480px; margin:0 auto; padding:24px; border-radius:8px; box-shadow:0 1px 4px rgba(0,0,0,0.1); }
    label { font-size:14px; font-weight:600; color:#333; }
    input, textarea { width:100%; padding:10px; margin:6px 0 16px; border:1px solid #ccc; border-radius:4px; box-sizing:border-box; font-size:14px; }
    button { background:#0b7d3e; color:#fff; border:none; padding:12px 20px; border-radius:6px; cursor:pointer; font-weight:bold; font-size:14px; }
    button:hover { background:#096631; }
    #status { max-width:480px; margin:12px auto; font-size:14px; color:#333; }
    #notifications { max-width:480px; margin:20px auto 0; }
    .notif { background:#e6f7ec; border-left:4px solid #0b7d3e; padding:10px 14px; margin-bottom:8px; border-radius:4px; font-size:14px; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(-4px);} to { opacity:1; transform:translateY(0);} }
  </style>
</head>
<body>
  <div class="card">
    <h2>Send Email</h2>
    <form id="emailForm">
      <label for="to">Recipient Email</label>
      <input type="email" id="to" required placeholder="user@example.com">

      <label for="subject">Subject</label>
      <input type="text" id="subject" required placeholder="Subject line">

      <label for="message">Message</label>
      <textarea id="message" rows="5" required placeholder="Write your message..."></textarea>

      <button type="submit">Send Email</button>
    </form>
  </div>

  <div id="status"></div>
  <div id="notifications"></div>

  <script>
    const BACKEND_URL = 'https://qeja-backend-azkf.onrender.com';

    const form = document.getElementById('emailForm');
    const status = document.getElementById('status');
    const notifications = document.getElementById('notifications');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      status.textContent = 'Sending...';

      const to = document.getElementById('to').value;
      const subject = document.getElementById('subject').value;
      const message = document.getElementById('message').value;

      try {
        const res = await fetch(`${BACKEND_URL}/send-email`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ to, subject, message }),
        });
        const data = await res.json();

        if (res.ok) {
          status.textContent = `Sent to ${to}. You'll see a notification below once they tap "Learn More".`;
          form.reset();
        } else {
          status.textContent = data.error || 'Failed to send.';
        }
      } catch (err) {
        status.textContent = 'Network error — please try again.';
      }
    });

    function renderNotification(data) {
      const div = document.createElement('div');
      div.className = 'notif';
      div.textContent = `${data.recipient_email} tapped "Learn More" on "${data.subject}" — ${new Date(data.clicked_at).toLocaleTimeString()}`;
      notifications.appendChild(div);
    }

    // Restore past clicks on load/refresh so history isn't lost
    async function loadHistory() {
      try {
        const res = await fetch(`${BACKEND_URL}/click-history`);
        const rows = await res.json();
        // oldest first, newest at the bottom to match live appends
        rows.reverse().forEach(renderNotification);
      } catch (err) {
        console.error('Failed to load click history', err);
      }
    }
    loadHistory();

    // Live updates: reconnects automatically if the connection drops
    const events = new EventSource(`${BACKEND_URL}/click-events`);
    events.onmessage = (e) => {
      renderNotification(JSON.parse(e.data));
    };
  </script>
</body>
</html>
